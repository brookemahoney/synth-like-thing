<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Synth-Like-Thing — a browser synthesiser</title>
    <meta
      name="description"
      content="A browser synthesiser: three oscillators, two filters, three LFOs, a modulation matrix, an 808 kit, a sequencer and an arpeggiator."
    />
    <link rel="stylesheet" href="./styles/base.css" />
    <link rel="stylesheet" href="./styles/controls.css" />
    <link rel="stylesheet" href="./styles/paint.css" />
    <!-- An empty data URI: the instrument ships no binary media, and this stops
         the browser asking for a favicon that is not there. -->
    <link rel="icon" href="data:," />
  </head>
  <body>
    <a class="skip-link" href="#instrument">Skip to the instrument</a>

    <main class="instrument" id="instrument" data-surface>
      <header class="masthead">
        <h1 class="masthead__title">Synth-Like-Thing</h1>
        <p class="masthead__sub">
          Drag a knob or a fader to change it. With one focused: arrow keys step, shift is fine,
          page keys are coarse, Home and End are the extremes, double-click is the default.
        </p>
      </header>

      <noscript>
        <p class="notice">The instrument needs JavaScript: every control is drawn from the parameter store.</p>
      </noscript>

      <!-- The eight functional regions, in vertical order. Each is declared here and
           filled in by web/ui/surface.js; later tasks fill the regions it does not
           yet own. The order is a contract: see ui/surface.js REGION_ORDER. -->

      <section class="region region--strip" data-region="global-strip" aria-labelledby="region-global-strip">
        <h2 class="region__title" id="region-global-strip">Global</h2>
        <div class="region__panels" data-panels></div>
      </section>

      <section class="region region--row" data-region="voice-row" aria-labelledby="region-voice-row">
        <h2 class="region__title" id="region-voice-row">Voices</h2>
        <div class="region__panels" data-panels></div>
      </section>

      <section class="region region--row" data-region="tone-row" aria-labelledby="region-tone-row">
        <h2 class="region__title" id="region-tone-row">Tone</h2>
        <div class="region__panels" data-panels></div>
      </section>

      <section class="region region--row" data-region="modulation-row" aria-labelledby="region-modulation-row">
        <h2 class="region__title" id="region-modulation-row">Modulation</h2>
        <div class="region__panels" data-panels></div>
      </section>

      <section class="region region--row" data-region="effects-row" aria-labelledby="region-effects-row">
        <h2 class="region__title" id="region-effects-row">Effects</h2>
        <div class="region__panels" data-panels></div>
      </section>

      <section class="region region--row region--kit" data-region="drum-kit" aria-labelledby="region-drum-kit">
        <h2 class="region__title" id="region-drum-kit">808 Kit</h2>
        <div class="region__panels" data-panels></div>
      </section>

      <section class="region region--wide" data-region="sequencer" aria-labelledby="region-sequencer">
        <h2 class="region__title" id="region-sequencer">Sequencer &amp; Arpeggiator</h2>
        <div class="region__panels" data-panels></div>
      </section>

      <section class="region region--wide" data-region="keyboard" aria-labelledby="region-keyboard">
        <h2 class="region__title" id="region-keyboard">Keyboard</h2>
        <div class="region__panels" data-panels></div>
        <!-- The keybed is BUILT by ui/keyboard.js into this mount point: 49 real
             <button> keys, C2 to C6, each with a visible label and an accessible
             name. It cannot be markup here without keeping the key table in two
             places, and a painted <span> would not be a control at all. The mount
             point is empty until the module runs, and the noscript notice above
             already says the instrument needs JavaScript. -->
        <div data-keybed-mount></div>
      </section>
    </main>

    <!-- THE FIRST SCRIPT ON THE PAGE, and the order is load-bearing: this module
         installs the `error` / `unhandledrejection` capture at module scope, so it is
         the earliest listener in the document and a throw inside any module evaluated
         after it is still recorded. It also publishes the read-only runtime inspection
         handle on `window.__instrument` synchronously, and starts the level meter —
         which publishes the measured level to the store key ui/paint.js documents, so
         the dab canvas below and the meter's own stroke agree on one number read from
         one authority. It imports no audio module at import time: the graph is resolved
         from dynamic imports inside startMeter(), in the browser. -->
    <script type="module" src="./ui/meter.js"></script>
    <!-- The preset panel: twelve slots plus JSON import/export. Self-initialises on
         import, like ui/paint.js and ui/keyboard.js, and statically imports
         audio/presets.js — so this one tag puts the preset data layer in the graph. -->
    <script type="module" src="./ui/preset-view.js"></script>
    <script type="module" src="./ui/main.js"></script>
    <!-- The painted layer: the generated ground texture and the reactive dab
         canvas. It self-initialises on import and reads only the parameter
         store, so it needs nothing from main.js. -->
    <script type="module" src="./ui/paint.js"></script>
    <!-- The POWER-ON GATE, ui/power.js. Self-initialises on import, like ui/paint.js
         above, and is loaded here rather than from ui/main.js because main.js is not
         this task's file to edit. It is the ONLY thing in the instrument that calls
         resumeInstrument(), and only from inside the POWER button's click handler:
         until that gesture the context stays suspended and the page says so. -->
    <script type="module" src="./ui/power.js"></script>
    <!-- The INPUT, ui/keyboard.js: the on-screen keybed, the computer-key tracker
         layout, the octave shift and latch. Self-initialises on import, the same
         shape as ui/paint.js and ui/power.js. It owns the one held-note registry
         and reaches audio/engine.js through a deferred import, so it never
         constructs or resumes audio. -->
    <script type="module" src="./ui/keyboard.js"></script>
  </body>
</html>
